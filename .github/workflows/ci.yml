name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: documentation and extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --check scripts/check-docs.mjs
      - run: node scripts/check-docs.mjs
      - run: npm ci
        working-directory: apps/extension
      - run: npm test
        working-directory: apps/extension
      - run: npm run build
        working-directory: apps/extension
      - name: Check changed commits for whitespace errors
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$CHANGE_BASE" HEAD
